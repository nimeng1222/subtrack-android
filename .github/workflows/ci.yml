name: SubTrack CI

# JVM 单测 + Lint + Debug 构建 + 模拟器设备门禁。
# 2026-10-31 首次在真实仓库运行后修正两处环境问题：
#   1. android-actions/setup-android@v3 会执行已下线的 `sdkmanager tools`，改为直接用 runner 预装的 sdkmanager；
#   2. emulator-runner 用 /bin/sh（dash）执行 script，`set -o pipefail` 会直接失败，改为 `set -eu`；
#      同时补 KVM udev 规则，避免无硬件加速时模拟器启动要 15 分钟。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  jvm-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 准备 Android SDK（runner 预装，不使用会调用已下线 tools 包的 action）
        run: |
          TOOL="$(command -v sdkmanager || ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$TOOL" --licenses > /dev/null
          "$TOOL" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: 设备结果协议自测
        run: python3 scripts/test-device-protocol.py
      - name: 服务端协议测试
        run: cd server && python3 -m unittest -v test_server.py
      - name: JVM 单元测试
        run: ./gradlew :app:testDebugUnitTest
      - name: Lint（需联网解析 lint-gradle 依赖）
        run: ./gradlew :app:lintDebug
      - name: Debug 构建
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 开启 KVM（没有硬件加速时模拟器启动会非常慢）
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 35 模拟器集成测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # emulator-runner 逐行执行 script：依赖服务与测试必须在同一个 bash 进程里，
          # 否则上一行起的 fixture 会在下一行开始前被清掉（设备端表现为 end of stream）。
          script: bash scripts/ci-device.sh artifacts/device-ci

      - name: 保留设备日志与结果（失败时也上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-results
          path: artifacts/device-ci/
